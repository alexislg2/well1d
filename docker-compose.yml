services:
  well1d:
    build: .
    # 127.0.0.1 uniquement : sinon l'app est joignable en clair depuis
    # l'extérieur sur 18083, en contournant TLS et en rendant
    # X-Forwarded-For falsifiable (donc le rate-limiting contournable).
    ports:
      - "127.0.0.1:18083:5000"
    # Répertoire et non fichier par fichier : le journal SQLite doit atterrir
    # sur l'hôte, sinon une écriture interrompue n'est pas récupérable par les
    # scripts qui lisent ces bases depuis l'extérieur du conteneur.
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - FLASK_ENV=production
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
