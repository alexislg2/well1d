<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName      well1d.somebod.com
        ProxyPass       / http://localhost:18083/
        ProxyPassReverse    / http://localhost:18083/

        # Apache pose X-Forwarded-For tout seul en reverse-proxy, mais pas
        # X-Forwarded-Proto : sans cette ligne Flask croit répondre en http.
        # Nécessite mod_headers (a2enmod headers).
        RequestHeader set X-Forwarded-Proto "https"

SSLCertificateFile /etc/letsencrypt/live/well1d.somebod.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/well1d.somebod.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
