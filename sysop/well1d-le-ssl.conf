<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName      well1d.somebod.com
        # timeout > celui de gunicorn (30 s) : c'est gunicorn qui coupe.
        ProxyPass       / http://localhost:18083/ connectiontimeout=5 timeout=35
        ProxyPassReverse    / http://localhost:18083/

        # L'app plafonne déjà à 16 Ko (MAX_CONTENT_LENGTH) : refuser plus gros
        # dès Apache évite de mobiliser un worker gunicorn pour rien.
        LimitRequestBody 65536
        LimitRequestFields 50

        # Slowloris : un client qui envoie ses en-têtes ou son corps au goutte-
        # à-goutte est coupé (mod_reqtimeout, actif par défaut sur Debian).
        RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=10-30,MinRate=500

        # Limite de débit par IP, si mod_evasive est installé
        # (apt install libapache2-mod-evasive) : 20 pages/s par IP, ban 60 s.
        <IfModule mod_evasive20.c>
            DOSPageCount        20
            DOSPageInterval     1
            DOSSiteCount        100
            DOSSiteInterval     1
            DOSBlockingPeriod   60
        </IfModule>

        # Apache pose X-Forwarded-For tout seul en reverse-proxy, mais pas
        # X-Forwarded-Proto : sans cette ligne Flask croit répondre en http.
        # Nécessite mod_headers (a2enmod headers).
        RequestHeader set X-Forwarded-Proto "https"

SSLCertificateFile /etc/letsencrypt/live/well1d.somebod.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/well1d.somebod.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
